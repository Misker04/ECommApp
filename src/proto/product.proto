syntax = "proto3";

package product;


// -------------------------------------------------
// Product Service Definition
// -------------------------------------------------

service ProductService {

  // -------- Seller APIs --------

  rpc RegisterItem (RegisterItemRequest)
      returns (RegisterItemResponse);

  rpc ChangePrice (ChangePriceRequest)
      returns (Empty);

  rpc UpdateQuantity (UpdateQuantityRequest)
      returns (Empty);

  rpc DisplayItemsForSale (SessionRequest)
      returns (ItemList);


  // -------- Buyer Product APIs --------

  rpc SearchItems (SearchRequest)
      returns (ItemList);

  rpc GetItem (ItemRequest)
      returns (ItemResponse);


  // -------- Cart APIs --------

  rpc AddToCart (CartRequest)
      returns (Empty);

  rpc RemoveFromCart (CartRequest)
      returns (Empty);

  rpc SaveCart (SessionRequest)
      returns (Empty);

  rpc ClearCart (SessionRequest)
      returns (Empty);

  rpc GetCart (SessionRequest)
      returns (CartResponse);


  // -------- Feedback --------

  rpc ProvideFeedback (FeedbackRequest)
      returns (Empty);


  // -------- Purchase --------

  rpc FinalizePurchase (SessionRequest)
      returns (PurchaseResult);
}


// -------------------------------------------------
// Common Session Message
// -------------------------------------------------

message SessionRequest {
  string session_token = 1;
}


// -------------------------------------------------
// Seller Messages
// -------------------------------------------------

message RegisterItemRequest {
  string session_token = 1;
  string name = 2;
  int32 category = 3;
  float price = 4;
  int32 quantity = 5;
}

message RegisterItemResponse {
  string item_id = 1;
}

message ChangePriceRequest {
  string session_token = 1;
  string item_id = 2;
  float new_price = 3;
}

message UpdateQuantityRequest {
  string session_token = 1;
  string item_id = 2;
  int32 quantity = 3;
}


// -------------------------------------------------
// Product Lookup
// -------------------------------------------------

message SearchRequest {
  string session_token = 1;
  int32 category = 2;
}

message ItemRequest {
  string session_token = 1;
  string item_id = 2;
}

message ItemResponse {
  string item_id = 1;
  string name = 2;
  float price = 3;
  int32 quantity = 4;
}

message ItemList {
  repeated ItemResponse items = 1;
}


// -------------------------------------------------
// Cart
// -------------------------------------------------

message CartRequest {
  string session_token = 1;
  string item_id = 2;
  int32 quantity = 3;
}

message CartItem {
  string item_id = 1;
  int32 quantity = 2;
}

message CartResponse {
  repeated CartItem items = 1;
}


// -------------------------------------------------
// Feedback
// -------------------------------------------------

message FeedbackRequest {
  string session_token = 1;
  string item_id = 2;
  string feedback = 3;
}


// -------------------------------------------------
// Purchase
// -------------------------------------------------

message PurchaseResult {
  bool success = 1;
  string message = 2;
}


// -------------------------------------------------
// Common
// -------------------------------------------------

message Empty {}

session_timeout_seconds: 300

# Replace VM1_IP..VM4_IP with the actual reachable IPs or hostnames of your VMs.
#
# VM layout used by scripts/run_pa3_vm.py:
# - VM1: soap, customer_0, product_0, seller_fe_0, buyer_fe_0
# - VM2: customer_1, product_1, seller_fe_1, buyer_fe_1
# - VM3: customer_2, customer_4, product_2, seller_fe_2, buyer_fe_2
# - VM4: customer_3, product_3, product_4, seller_fe_3, buyer_fe_3

customer_replicas:
  - id: 0
    host: "VM1_IP"
    buyer_grpc_port: 51051
    seller_grpc_port: 51053
    udp_port: 60000
  - id: 1
    host: "VM2_IP"
    buyer_grpc_port: 51151
    seller_grpc_port: 51153
    udp_port: 60001
  - id: 2
    host: "VM3_IP"
    buyer_grpc_port: 51251
    seller_grpc_port: 51253
    udp_port: 60002
  - id: 3
    host: "VM4_IP"
    buyer_grpc_port: 51351
    seller_grpc_port: 51353
    udp_port: 60003
  - id: 4
    host: "VM3_IP"
    buyer_grpc_port: 51451
    seller_grpc_port: 51453
    udp_port: 60004

product_replicas:
  - id: 0
    host: "VM1_IP"
